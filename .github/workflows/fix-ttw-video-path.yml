name: Fix TTW video path

on:
  push:
    branches: [main]
    paths:
      - 'ai-tech-portfolio/src/App.tsx'
      - '.github/workflows/fix-ttw-video-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix TTW asset path
        shell: bash
        run: |
          file="ai-tech-portfolio/src/App.tsx"
          if grep -q '/ttw-autos-commercial.mp4' "$file"; then
            sed -i 's#\/ttw-autos-commercial\.mp4#\/ttw-autos-commercial.mp4.mp4#g' "$file"
          fi

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-tech-portfolio/src/App.tsx
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Fix TTW commercial asset path'
          git push
